services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boiler
      POSTGRES_PASSWORD: boiler
      POSTGRES_DB: boiler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boiler -d boiler"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://boiler:boiler@db:5432/boiler
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
